[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4.46"
toml = "1.1.8"
toml_edit = "0.25.17"
ureq = "3.5.0"
walkdir = "2.5.0"
zip = { version = "2", default-features = false, features = ["deflate"] }
