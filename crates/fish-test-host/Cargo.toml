[package]
name = "fish-test-host"
description = "In-process Fish host for tests and `cargo fish test`"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
fish-api = { path = "../fish-api" }
fish-loader = { path = "../fish-loader" }
fish-pack = { path = "../fish-pack" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tempfile = "3.27.0"
toml = "1.1.8"
