[package]
name = "cargo-fish"
description = "cargo subcommand for building, checking and testing Fish mods"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "cargo_fish"

[[bin]]
name = "cargo-fish"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
fish-launch = { path = "../fish-launch" }
fish-loader = { path = "../fish-loader" }
semver = "1"
serde_json = "1"
fish-metadata = { path = "../fish-metadata" }
fish-pack = { path = "../fish-pack" }
fish-test-host = { path = "../fish-test-host" }
toml = "1"

[dev-dependencies]
fish-pack = { path = "../fish-pack" }
tempfile = "3.27.0"
