# Edits applied to the staged Horizon workspace by `cargo xtask edition stage`.
members = [
    "fish/crates/fish-abi",
    "fish/crates/fish-metadata",
    "fish/crates/fish-pack",
    "fish/crates/fish-hooks",
    "fish/crates/fish-loader",
]

[[dependency]]
crate = "crates/horizon-client"
name = "fish-loader"
path = "../../fish/crates/fish-loader"

[[dependency]]
crate = "crates/horizon-client"
name = "fish-hooks"
path = "../../fish/crates/fish-hooks"

# `/gamerule` completion: the command tree is built in horizon-command.
[[dependency]]
crate = "crates/horizon-command"
name = "fish-hooks"
path = "../../fish/crates/fish-hooks"

# Block events of the simulation (patch 0007): the level code asks Fish which states are blocks of mods.
[[dependency]]
crate = "crates/horizon-world"
name = "fish-hooks"
path = "../../fish/crates/fish-hooks"
