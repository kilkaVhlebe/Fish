# Fish's horizon-mixins bundle. xtask fills the @placeholders@ when it assembles the bundle.
[mod]
id = "fish"
version = "@FISH_VERSION@"
priority = 1000

[compatibility]
horizon_revision = "@HORIZON_COMMIT@"

[[module]]
id = "bridge"
file = "crates/horizon-client/src/game.rs"
name = "fish_bridge"
source = "modules/bridge.rs"

[[module]]
id = "lib"
file = "crates/horizon-client/src/lib.rs"
name = "fish_lib"
source = "modules/lib.rs"
visibility = "pub"

[[injection]]
id = "boot"
target = "horizon_client::spans::enable"
kind = "HEAD"
helper = "helpers/boot.rs"
bindings = []

[[injection]]
id = "tick-start"
target = "horizon_client::game::Game<'_>::tick"
kind = "HEAD"
helper = "helpers/tick_start.rs"
bindings = [ { name = "game", ty = "&mut Game<'_>", value = "&mut *self" } ]

